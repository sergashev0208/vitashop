<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitamino_2022 Mini App</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-pink: #ff69b4;
            --dark-pink: #d81b60;
            --light-pink: #fff0f5;
            --accent-pink: #ffb6c1;
            --text-color: #333;
            --bg-color: #fcf8f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px; /* Space for sticky cart bar */
        }

        header {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .container {
            padding: 15px;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--dark-pink);
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Utility classes for screen management */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Grid Layout for Categories */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            border: 2px solid var(--accent-pink);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card:active {
            transform: scale(0.97);
            background-color: var(--light-pink);
        }

        .card img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
            object-fit: contain;
        }

        .card h3 {
            font-size: 1rem;
            color: var(--text-color);
        }

        /* Language Selector Screen */
        .lang-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-lang {
            background: white;
            border: 2px solid var(--primary-pink);
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--dark-pink);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-lang:active {
            background: var(--primary-pink);
            color: white;
        }

        /* Products Display */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            border: 1px solid var(--accent-pink);
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .product-img {
            width: 90px;
            height: 90px;
            background-color: var(--light-pink);
            border-radius: 10px;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
        }

        .product-info h4 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .product-info p {
            color: #777;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
            color: var(--dark-pink);
            font-size: 1.05rem;
        }

        .btn-add {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-add:active {
            background-color: var(--dark-pink);
        }

        /* Back Navigation Button */
        .btn-back {
            background: none;
            border: none;
            color: var(--dark-pink);
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            font-size: 0.95rem;
        }

        /* Sticky Footer Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .cart-icon-wrapper {
            position: relative;
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--dark-pink);
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .btn-order {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(216, 27, 96, 0.3);
        }

        .btn-order:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Modal styling for viewing Savatcha items */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: flex-end;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-modal {
            font-size: 1.5rem;
            cursor: pointer;
            color: #aaa;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f9f9f9;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-clear {
            background: none;
            border: none;
            color: red;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vitamino_2022</h1>
        <p>Sog'ligingiz uchun eng sara vitaminlar</p>
    </header>

    <div class="container">
        
        <!-- SCREEN 1: CATEGORIES -->
        <div id="screen-categories" class="screen active">
            <div class="section-title">Kategoriyalar / Категории</div>
            <div class="grid" id="categories-grid">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- SCREEN 2: LANGUAGE SELECTION -->
        <div id="screen-language" class="screen">
            <button class="btn-back" onclick="navigateBack('screen-categories')">← Ortga / Назад</button>
            <div class="section-title">Tilni tanlang / Выберите язык</div>
            <div class="lang-container">
                <button class="btn-lang" onclick="selectLanguage('uzb')">🇺🇿 O'zbekcha (UZB)</button>
                <button class="btn-lang" onclick="selectLanguage('rus')">🇷🇺 Русский (RUS)</button>
            </div>
        </div>

        <!-- SCREEN 3: FORMS / PRODUCTS -->
        <div id="screen-products" class="screen">
            <button class="btn-back" onclick="navigateBack('screen-language')">← Ortga / Назад</button>
            <div class="section-title" id="products-title">Vitamin turlari</div>
            <div class="product-list" id="products-list">
                <!-- Dynamically populated forms (parashok & chaynaladigan) -->
            </div>
        </div>

    </div>

    <!-- STICKY FOOTER VIEW (Savatcha & Buyurtma berish) -->
    <div class="cart-bar">
        <div class="cart-info" onclick="toggleCartModal(true)">
            <div class="cart-icon-wrapper">
                <span style="font-size: 1.6rem;">🛒</span>
                <span class="badge" id="cart-count">0</span>
            </div>
            <div>
                <div style="font-weight: bold; font-size: 0.9rem;" id="cart-title-text">Savatcha</div>
                <div class="price" id="cart-total">0 UZS</div>
            </div>
        </div>
        <button class="btn-order" id="btn-checkout" disabled onclick="placeOrder()">Buyurtma berish</button>
    </div>

    <!-- SAVATCHA MODAL WINDOW -->
    <div class="modal" id="cart-modal" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title-text">Savatcha tarkibi</h3>
                <span class="close-modal" onclick="toggleCartModal(false)">&times;</span>
            </div>
            <div id="modal-items-list">
                <!-- Cart items will be generated here -->
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Expand app to full screen

        // Mock Database of Vitamins
        const mockCategories = [
            { id: 'vit_c', nameUz: 'Vitamin C', nameRu: 'Витамин C', icon: '🍋' },
            { id: 'vit_d3', nameUz: 'Vitamin D3', nameRu: 'Витамин D3', icon: '☀️' },
            { id: 'zinc', nameUz: 'Sink', nameRu: 'Цинк', icon: '🧬' },
            { id: 'multivit', nameUz: 'Multivitamin', nameRu: 'Мультивитамины', icon: '💊' }
        ];

        // System state variables
        let selectedCategory = null;
        let selectedLanguage = 'uzb';
        let cart = [];

        // UI text elements mapping based on chosen language
        const dictionary = {
            uzb: {
                parashok: "Parashok shaklidagi",
                chaynaladigan: "Chaynaladigan",
                desc_parashok: "Suvda tez eruvchi, yuqori samarali kukun shakli.",
                desc_chaynaladigan: "Yoqimli ta'mga ega, chaynaladigan vitaminlar.",
                savatcha: "Savatcha",
                buyurtma: "Buyurtma berish",
                tarkib: "Savatcha tarkibi",
                qoshish: "Qo'shish",
                bosh: "Savatchangiz bo'sh"
            },
            rus: {
                parashok: "В порошке",
                chaynaladigan: "Жевательные",
                desc_parashok: "Быстрорастворимая высокоэффективная порошковая форма.",
                desc_chaynaladigan: "Жевательные витамины с приятным вкусом.",
                savatcha: "Корзина",
                buyurtma: "Оформить заказ",
                tarkib: "Содержимое корзины",
                qoshish: "Добавить",
                bosh: "Ваша корзина пуста"
            }
        };

        // Render Initial Categories Grid
        function renderCategories() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';
            mockCategories.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => chooseCategory(cat);
                card.innerHTML = `
                    <div style="font-size: 2.5rem; margin-bottom: 8px;">${cat.icon}</div>
                    <h3>${cat.nameUz} / ${cat.nameRu}</h3>
                `;
                grid.appendChild(card);
            });
        }

        // Navigation Controllers
        function changeScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function navigateBack(screenId) {
            changeScreen(screenId);
        }

        function chooseCategory(category) {
            selectedCategory = category;
            changeScreen('screen-language');
        }

        function selectLanguage(lang) {
            selectedLanguage = lang;
            updateCartBarLanguage();
            renderProducts();
            changeScreen('screen-products');
        }

        // Dynamically adjust localized footer elements
        function updateCartBarLanguage() {
            document.getElementById('cart-title-text').innerText = dictionary[selectedLanguage].savatcha;
            document.getElementById('modal-title-text').innerText = dictionary[selectedLanguage].tarkib;
            document.getElementById('btn-checkout').innerText = dictionary[selectedLanguage].buyurtma;
        }

        // Render the "Parashok" and "Chaynaladigan" options for selected vitamin
        function renderProducts() {
            const titleElement = document.getElementById('products-title');
            const listContainer = document.getElementById('products-list');
            
            const catName = selectedLanguage === 'uzb' ? selectedCategory.nameUz : selectedCategory.nameRu;
            titleElement.innerText = `${catName} - Turlari`;

            listContainer.innerHTML = '';

            // 1. Form Type: Parashok
            const itemParashok = {
                id: `${selectedCategory.id}_parashok`,
                name: `${catName} (${dictionary[selectedLanguage].parashok})`,
                price: 120000,
                img: "https://images.unsplash.com/photo-1616679911721-eff6eec18fcd?w=150" // Placeholder clean image
            };

            // 2. Form Type: Chaynaladigan
            const itemChaynaladigan = {
                id: `${selectedCategory.id}_chaynaladigan`,
                name: `${catName} (${dictionary[selectedLanguage].chaynaladigan})`,
                price: 145000,
                img: "https://images.unsplash.com/photo-1611926653458-09294b3142bf?w=150" // Placeholder clean image
            };

            [itemParashok, itemChaynaladigan].forEach(product => {
                const isParashok = product.id.includes('parashok');
                const desc = isParashok ? dictionary[selectedLanguage].desc_parashok : dictionary[selectedLanguage].desc_chaynaladigan;
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.img}" class="product-img" alt="${product.name}">
                    <div class="product-info">
                        <h4>${product.name}</h4>
                        <p>${desc}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="price">${product.price.toLocaleString()} UZS</span>
                            <button class="btn-add" onclick="addToCart('${product.id}', '${product.name}', ${product.price})">
                                + ${dictionary[selectedLanguage].qoshish}
                            </button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Shopping Cart Operations
        function addToCart(id, name, price) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            updateCartUI();
            
            // Haptic feedback for added items via Telegram
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function changeQuantity(id, change) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
            renderCartModalItems();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total').innerText = `${totalPrice.toLocaleString()} UZS`;

            const checkoutBtn = document.getElementById('btn-checkout');
            if (totalCount > 0) {
                checkoutBtn.disabled = false;
            } else {
                checkoutBtn.disabled = true;
                toggleCartModal(false);
            }
        }

        // Drawer Modal View for Checkout Summary
        function toggleCartModal(show) {
            const modal = document.getElementById('cart-modal');
            if (show && cart.length > 0) {
                modal.classList.add('active');
                renderCartModalItems();
            } else {
                modal.classList.remove('active');
            }
        }

        function closeModalOutside(event) {
            if (event.target.id === 'cart-modal') {
                toggleCartModal(false);
            }
        }

        function renderCartModalItems() {
            const container = document.getElementById('modal-items-list');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding: 20px; color: #aaa;">${dictionary[selectedLanguage].bosh}</p>`;
                return;
            }

            cart.forEach(item => {
                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div>
                        <div style="font-weight: 500; font-size: 0.95rem;">${item.name}</div>
                        <div style="font-size: 0.85rem; color: var(--dark-pink);">${(item.price * item.quantity).toLocaleString()} UZS</div>
                    </div>
                    <div class="cart-item-actions">
                        <button class="btn-add" style="padding: 4px 10px;" onclick="changeQuantity('${item.id}', -1)">-</button>
                        <span style="font-weight: bold; font-size: 1rem;">${item.quantity}</span>
                        <button class="btn-add" style="padding: 4px 10px;" onclick="changeQuantity('${item.id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Transmit checkout data back to Telegram Pipeline
        function placeOrder() {
            if (cart.length === 0) return;

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            // Structured data payload package object
            const orderPayload = {
                items: cart,
                total_price: totalPrice,
                language: selectedLanguage,
                timestamp: new Date().toISOString()
            };

            // Send raw data directly back to Telegram Bot via stringified transmission API 
            tg.sendData(JSON.stringify(orderPayload));
            
            // Safe close request confirmation interface
            tg.close();
        }

        // Initialize execution setup calls on window injection load state
        window.onload = () => {
            renderCategories();
        };
    </script>
</body>
</html>
