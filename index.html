<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vitamino_2022</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.cdnfonts.com/css/caviar-dreams" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700&display=swap');

  :root {
    --pink: #F4860A;
    --pink-dark: #D4720A;
    --pink-mid: #F9A84D;
    --pink-light: #FEF0DC;
    --pink-pale: #FFF8F0;
    --purple: #7B5EA7;
    --purple-dark: #6A4D9B;
    --purple-light: #EDE8F5;
    --purple-pale: #F5F2FB;
    --orange: #F4860A;
    --orange-light: #FEF0DC;
    --white: #FFFFFF;
    --gray: #F7F4FB;
    --text: #2C1A4E;
    --text-soft: #8B76A9;
    --card-shadow: 0 4px 20px rgba(123,94,167,0.12);
    --radius: 18px;
    --bottom-bar: 72px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--gray);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(var(--bottom-bar) + 16px);
    overflow-x: hidden;
  }

  .header {
    background: linear-gradient(135deg, #6A4D9B 0%, #7B5EA7 60%, #9B7EC8 100%);
    padding: 20px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(106,77,155,0.40);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .logo {
    font-family: 'Caviar Dreams', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: white;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .logo-v { font-size: 28px; color: #F9C97A; font-weight: 700; }
  .logo-year { color: #F9C97A; font-size: 18px; letter-spacing: 2px; }
  .lang-toggle {
    display: flex;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    padding: 4px 12px;
    border: none;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: rgba(255,255,255,0.7);
  }
  .lang-btn.active { background: white; color: var(--purple-dark); }

  .categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    white-space: nowrap;
    padding: 6px 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    background: transparent;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .cat-btn.active { background: white; color: var(--purple-dark); border-color: white; }

  .section-title {
    font-size: 16px;
    font-weight: 800;
    padding: 16px 16px 8px;
    color: var(--text);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 16px;
  }
  .card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s;
    position: relative;
    border: 1px solid #E8E0F5;
  }
  .card:active { transform: scale(0.97); }
  .card-img-wrap {
    width: 100%;
    height: 130px;
    background: var(--purple-light);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-img-emoji { font-size: 52px; line-height: 1; }
  .card-body { padding: 10px 12px 12px; }
  .card-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; line-height: 1.2; }
  .card-sub { font-size: 11px; color: var(--text-soft); margin-bottom: 8px; }
  .card-price { font-size: 15px; font-weight: 900; color: var(--purple-dark); }
  .card-price-from { font-size: 10px; font-weight: 600; color: var(--text-soft); display: block; margin-bottom: 1px; }
  .card-add {
    position: absolute;
    bottom: 12px;
    right: 10px;
    width: 28px;
    height: 28px;
    background: var(--purple);
    border-radius: 50%;
    border: none;
    color: white;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(123,94,167,0.4);
    transition: background 0.2s, transform 0.15s;
  }
  .card-add:active { transform: scale(0.9); background: var(--purple-dark); }
  .badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: linear-gradient(135deg, #F9A84D, #F4860A);
    color: white;
    font-size: 10px;
    font-weight: 800;
    border-radius: 8px;
    padding: 2px 7px;
    z-index: 2;
  }

  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #E8E0F5;
    padding: 10px 16px 12px;
    display: flex;
    gap: 10px;
    z-index: 200;
    box-shadow: 0 -4px 20px rgba(123,94,167,0.12);
  }
  .btn-cart {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    border: 2.5px solid var(--purple);
    background: white;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .btn-cart:active { background: var(--purple-light); }
  .cart-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--orange);
    color: white;
    font-size: 11px;
    font-weight: 900;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .btn-order {
    flex: 1;
    height: 52px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #6A4D9B, #F4860A);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(123,94,167,0.35);
  }
  .btn-order:active { transform: scale(0.98); opacity: 0.92; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44,26,78,0.55);
    z-index: 300;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding-bottom: 28px;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 36px;
    height: 4px;
    background: #D8D0EE;
    border-radius: 2px;
    margin: 10px auto 16px;
  }

  .modal-image-wrap {
    position: relative;
    width: 100%;
    height: 280px;
    background: var(--purple-light);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-in;
  }
  .modal-image-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
  .modal-image-emoji { font-size: 90px; line-height: 1; }
  .img-lang-pills {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
    z-index: 5;
  }
  .img-lang-pill {
    padding: 4px 13px;
    border-radius: 20px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    background: rgba(255,255,255,0.35);
    color: white;
    backdrop-filter: blur(6px);
    transition: all 0.2s;
  }
  .img-lang-pill.active { background: white; color: var(--purple-dark); }
  .zoom-hint {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(106,77,155,0.7);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }

  .zoom-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.93);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .zoom-overlay.open { display: flex; }
  .zoom-overlay img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 12px;
    touch-action: pinch-zoom;
  }
  .zoom-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    font-size: 26px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }

  .modal-body { padding: 18px 16px 0; }
  .modal-name { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 4px; }

  .modal-price-wrap {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 16px;
  }
  .modal-price {
    font-size: 22px;
    font-weight: 900;
    color: var(--purple-dark);
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-price.price-changed {
    transform: scale(1.08);
    color: var(--orange);
  }
  .modal-price-per {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 600;
  }

  .pkg-section { margin-bottom: 18px; }
  .pkg-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pkg-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .pkg-btn {
    position: relative;
    padding: 10px 14px;
    border-radius: 14px;
    border: 2px solid #E8E0F5;
    background: white;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    min-width: 88px;
    flex: 1;
  }
  .pkg-btn.active {
    border-color: var(--purple);
    background: var(--purple-light);
    box-shadow: 0 2px 10px rgba(123,94,167,0.2);
  }
  .pkg-btn.best-value::after {
    content: attr(data-label);
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #F9A84D, #F4860A);
    color: white;
    font-size: 9px;
    font-weight: 900;
    padding: 2px 7px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .pkg-qty { font-size: 16px; font-weight: 900; color: var(--text); display: block; line-height: 1.2; }
  .pkg-btn.active .pkg-qty { color: var(--purple-dark); }
  .pkg-price { font-size: 12px; font-weight: 700; color: var(--text-soft); display: block; margin-top: 2px; }
  .pkg-btn.active .pkg-price { color: var(--purple); }

  .form-type-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
  .type-options { display: flex; gap: 10px; margin-bottom: 20px; }
  .type-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 14px;
    border: 2px solid #E8E0F5;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    color: var(--text-soft);
  }
  .type-btn.active { border-color: var(--purple); background: var(--purple-light); color: var(--purple-dark); }
  .type-icon { font-size: 20px; display: block; margin-bottom: 4px; }

  .brand-section { margin-bottom: 18px; }
  .brand-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .brand-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    border-radius: 40px;
    border: 2px solid #E8E0F5;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-soft);
    white-space: nowrap;
  }
  .brand-btn.active {
    border-color: var(--purple);
    background: var(--purple-light);
    color: var(--purple-dark);
    box-shadow: 0 2px 10px rgba(123,94,167,0.18);
  }
  .brand-btn .brand-logo { font-size: 18px; line-height: 1; flex-shrink: 0; }
  .brand-btn .brand-name { line-height: 1.15; }
  .brand-check {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--purple-dark);
    color: white;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 900;
  }
  .brand-btn.active .brand-check { display: flex; }

  .modal-actions { display: flex; gap: 10px; padding: 0 16px; }
  .btn-add-cart {
    flex: 1;
    height: 50px;
    border-radius: 14px;
    border: 2.5px solid var(--purple);
    background: white;
    color: var(--purple-dark);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-add-cart:active { background: var(--purple-light); }
  .btn-order-now {
    flex: 1.4;
    height: 50px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #6A4D9B, #F4860A);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(123,94,167,0.35);
    transition: opacity 0.2s;
  }
  .btn-order-now:active { opacity: 0.88; }

  .addr-modal {
    background: white;
    border-radius: 24px 24px 0 0;
    width: 100%;
    padding-bottom: 28px;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .addr-title { font-size: 18px; font-weight: 900; color: var(--text); padding: 0 16px 16px; }
  .addr-subtitle { font-size: 13px; color: var(--text-soft); padding: 0 16px 20px; margin-top: -10px; line-height: 1.5; }
  .addr-field { padding: 0 16px 16px; }
  .addr-label { font-size: 13px; font-weight: 800; color: var(--purple-dark); margin-bottom: 8px; display: block; }
  .addr-input {
    width: 100%;
    padding: 13px 16px;
    border: 2px solid #E8E0F5;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    background: var(--purple-pale);
  }
  .addr-input:focus { border-color: var(--purple); background: white; }
  .addr-input::placeholder { color: #B0A0CC; }
  .addr-confirm {
    width: calc(100% - 32px);
    margin: 4px 16px 0;
    height: 52px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #6A4D9B, #F4860A);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(123,94,167,0.35);
  }
  .addr-confirm:active { opacity: 0.88; }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #EDE8F5;
  }
  .cart-item-thumb {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--purple-light);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .cart-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-item-type { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .cart-item-price { font-size: 14px; font-weight: 800; color: var(--purple-dark); white-space: nowrap; }
  .cart-qty-row { display: flex; align-items: center; gap: 6px; }
  .cart-qty-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 2px solid #E8E0F5;
    background: white;
    font-size: 16px; font-weight: 900;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--purple-dark);
  }
  .cart-qty-btn:active { background: var(--purple-light); border-color: var(--purple); }
  .cart-qty-btn.remove { border-color: #FFD6CC; color: var(--orange); }
  .cart-qty-btn.remove:active { background: #FFF0EC; }
  .cart-qty-num { font-size: 15px; font-weight: 900; color: var(--text); min-width: 18px; text-align: center; }
  .cart-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    font-size: 16px;
    font-weight: 900;
    background: var(--purple-pale);
    margin: 8px 16px;
    border-radius: 14px;
  }
  .cart-empty { text-align: center; padding: 40px 16px; color: var(--text-soft); font-size: 15px; }
  .cart-empty-icon { font-size: 50px; margin-bottom: 12px; }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--orange);
    color: white;
    padding: 12px 20px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(106,77,155,0.35);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo"><span class="logo-v">V</span>itamino<span class="logo-year">_2022</span> 🌸</div>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('uz')">UZ</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
    </div>
  </div>
  <div class="categories" id="categories"></div>
</div>

<div class="section-title" id="sectionTitle">Barcha vitaminlar</div>
<div class="grid" id="grid"></div>

<div class="bottom-bar">
  <button class="btn-cart" onclick="openCart()">
    🛒
    <span class="cart-badge" id="cartBadge">0</span>
  </button>
  <button class="btn-order" id="orderBtn" onclick="startOrder()">📦 Buyurtma berish</button>
</div>

<div class="modal-overlay" id="detailModal" onclick="handleOverlayClick(event,'detailModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-image-wrap" id="modalImageWrap" onclick="openZoom()">
      <div class="img-lang-pills">
        <button class="img-lang-pill active" id="imgLangUz" onclick="event.stopPropagation();setImgLang('uz')">🇺🇿 UZ</button>
        <button class="img-lang-pill" id="imgLangRu" onclick="event.stopPropagation();setImgLang('ru')">🇷🇺 RU</button>
      </div>
      <div class="zoom-hint" id="zoomHint">🔍 Rasm bosing — zoom</div>
    </div>
    <div class="modal-body">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-price-wrap">
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-price-per" id="modalPricePer"></div>
      </div>

let lang = 'uz';
let selectedCat = 'hammasi';
let currentProduct = null;
let imgLang = 'uz';
let selectedType = 'powder';
let selectedPkgIndex = 0;
let selectedBrandIndex = 0;
let cart = [];
let pendingOrderItems = null;

// ─── UTIL: paket birligini oladi ───
// unit yozilgan bo'lsa shu qaytadi, yo'q bo'lsa tarjimon'dan oladi
function pkgUnit(pk) {
  if (!pk.unit || pk.unit === '') return t('pkgUnit');  // dona / шт
  // g, ml, kaps — shundayligicha
  return pk.unit;
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === l.toUpperCase())
  );
  renderCategories();
  renderProducts();
  updateStaticText();
}
function t(key) { return translations[lang][key]; }
function updateStaticText() {
  document.getElementById('orderBtn').textContent = t('orderBtn');
  document.getElementById('cartTitle').textContent = t('cartTitle');
  document.getElementById('sectionTitle').textContent = t('allVit');
  if (currentProduct) populateModal(currentProduct);
}

function renderCategories() {
  document.getElementById('categories').innerHTML = categories.map(c =>
    `<button class="cat-btn ${selectedCat === c.key ? 'active' : ''}" onclick="selectCat('${c.key}')">${c[lang]}</button>`
  ).join('');
}
function selectCat(key) {
  selectedCat = key;
  renderCategories();
  renderProducts();
}

function getMinPrice(p) { return Math.min(...p.packages.map(pk => pk.price)); }
function renderProducts() {
  const filtered = selectedCat === 'hammasi' ? products : products.filter(p => p.cat === selectedCat);
  document.getElementById('grid').innerHTML = filtered.map(p => {
    const info = p[lang];
    const imgUrl = lang === 'ru' ? p.imageRu : p.imageUz;
    const imgTag = imgUrl
      ? `<img src="${imgUrl}" alt="${info.name}" style="width:100%;height:100%;object-fit:cover;">`
      : `<span class="card-img-emoji">${p.emoji}</span>`;
    const minPrice = getMinPrice(p);
    const showFrom = p.hasPackages && p.packages.length > 1;
    return `
    <div class="card" onclick="openDetail(${p.id})">
      ${p.badge ? `<div class="badge">${p.badge}</div>` : ''}
      <div class="card-img-wrap">${imgTag}</div>
      <div class="card-body">
        <div class="card-name">${info.name}</div>
        <div class="card-sub">${info.sub}</div>
        <div class="card-price">
          ${showFrom ? `<span class="card-price-from">${t('fromPrice')}</span>` : ''}
          ${minPrice.toLocaleString()} ${t('currency')}
        </div>
      </div>
      <button class="card-add" onclick="quickAdd(event,${p.id})">+</button>
    </div>`;
  }).join('');
}

function renderModalImage(p, il) {
  const wrap = document.getElementById('modalImageWrap');
  const pills = wrap.querySelector('.img-lang-pills');
  const hint = wrap.querySelector('.zoom-hint');
  wrap.innerHTML = '';
  wrap.appendChild(pills);
  wrap.appendChild(hint);

  let url = il === 'ru' ? (p.hasImageRu ? p.imageRu : null) : p.imageUz;
  const ruPill = document.getElementById('imgLangRu');
  if (ruPill) ruPill.style.display = p.hasImageRu ? '' : 'none';

  if (url) {
    const img = document.createElement('img');
    img.src = url; img.alt = p[il].name; img.id = 'modalImg';
    img.onerror = () => {
      img.remove();
      const em = document.createElement('div');
      em.className = 'modal-image-emoji'; em.textContent = p.emoji;
      wrap.insertBefore(em, pills); hint.style.display = 'none';
    };
    wrap.insertBefore(img, pills); hint.style.display = '';
  } else {
    const em = document.createElement('div');
    em.className = 'modal-image-emoji'; em.textContent = p.emoji;
    wrap.insertBefore(em, pills); hint.style.display = 'none';
  }
}

function openZoom() {
  const img = document.getElementById('modalImg');
  if (!img) return;
  document.getElementById('zoomImg').src = img.src;
  document.getElementById('zoomOverlay').classList.add('open');
}
function closeZoom() { document.getElementById('zoomOverlay').classList.remove('open'); }

function renderBrandOptions(p) {
  document.getElementById('brandOptions').innerHTML = p.brands.map((br, i) => `
    <button class="brand-btn ${i === selectedBrandIndex ? 'active' : ''}" onclick="selectBrand(${i})">
      <span class="brand-check">✓</span>
      <span class="brand-logo">${br.logo}</span>
      <span class="brand-name">${lang === 'ru' ? br.nameRu : br.nameUz}</span>
    </button>`).join('');
}
function selectBrand(i) { selectedBrandIndex = i; renderBrandOptions(currentProduct); }

// ─── PACKAGE SELECTOR — unit qo'llab-quvvatlanadi ───
function renderPkgOptions(p) {
  document.getElementById('pkgOptions').innerHTML = p.packages.map((pk, i) => `
    <button class="pkg-btn ${i === selectedPkgIndex ? 'active' : ''} ${pk.bestValue ? 'best-value' : ''}"
      data-label="${t('pkgBestValue')}" onclick="selectPkg(${i})">
      <span class="pkg-qty">${pk.qty} ${pkgUnit(pk)}</span>
      <span class="pkg-price">${pk.price.toLocaleString()} ${t('currency')}</span>
    </button>`).join('');
}

function selectPkg(i) { selectedPkgIndex = i; renderPkgOptions(currentProduct); updateModalPrice(); }

function updateModalPrice() {
  if (!currentProduct) return;
  const pkg = currentProduct.packages[selectedPkgIndex];
  const priceEl = document.getElementById('modalPrice');
  priceEl.textContent = `${pkg.price.toLocaleString()} ${t('currency')}`;
  priceEl.classList.remove('price-changed');
  void priceEl.offsetWidth;
  priceEl.classList.add('price-changed');
  setTimeout(() => priceEl.classList.remove('price-changed'), 400);
  document.getElementById('modalPricePer').textContent = '';
}

function openDetail(id) {
  currentProduct = products.find(p => p.id === id);
  imgLang = lang;
  selectedType = currentProduct.hasTypes ? 'powder' : 'none';
  selectedPkgIndex = 0; selectedBrandIndex = 0;
  populateModal(currentProduct);
  document.getElementById('detailModal').classList.add('open');
}

function populateModal(p) {
  renderModalImage(p, imgLang);
  document.getElementById('modalName').textContent = p[imgLang].name;

  const brandBlock = document.getElementById('brandBlock');
  if (p.hasBrands && p.brands.length > 0) {
    brandBlock.style.display = '';
    document.getElementById('brandTitle').textContent = t('brandTitle');
    renderBrandOptions(p);
  } else { brandBlock.style.display = 'none'; }

  const pkgBlock = document.getElementById('pkgBlock');
  if (p.hasPackages) {
    pkgBlock.style.display = '';
    document.getElementById('pkgTitle').textContent = t('pkgTitle');
    renderPkgOptions(p);
  } else { pkgBlock.style.display = 'none'; }
  updateModalPrice();

  document.getElementById('btnAddCart').textContent = t('addCart');
  document.getElementById('btnOrderNow').textContent = t('orderNow');
  document.getElementById('imgLangUz').classList.toggle('active', imgLang === 'uz');
  document.getElementById('imgLangRu').classList.toggle('active', imgLang === 'ru');
  const hint = document.getElementById('zoomHint');
  if (hint) hint.textContent = t('zoomHint');

  const typeBlock = document.getElementById('typeBlock');
  if (p.hasTypes) {
    typeBlock.style.display = '';
    document.getElementById('formTypeTitle').textContent = t('formType');
    document.getElementById('typePowderLabel').textContent = t('powder');
    document.getElementById('typeChewLabel').textContent = t('chew');
    document.getElementById('typePowder').classList.toggle('active', selectedType === 'powder');
    document.getElementById('typeChew').classList.toggle('active', selectedType === 'chew');
  } else { typeBlock.style.display = 'none'; selectedType = 'none'; }
}

function setImgLang(l) { imgLang = l; if (currentProduct) populateModal(currentProduct); }
function selectType(type) {
  selectedType = type;
  document.getElementById('typePowder').classList.toggle('active', type === 'powder');
  document.getElementById('typeChew').classList.toggle('active', type === 'chew');
}

function getSelectedBrand(p, brandIndex) {
  if (!p.hasBrands || !p.brands.length) return null;
  return p.brands[brandIndex] || null;
}

function quickAdd(e, id) {
  e.stopPropagation();
  const p = products.find(x => x.id === id);
  const pkg = p.packages[0];
  addItem(p, p.hasTypes ? 'powder' : 'none', 0, pkg, getSelectedBrand(p, 0), 0);
  showToast(t('toastAdded'));
}
function addToCart() {
  if (!currentProduct) return;
  const pkg = currentProduct.packages[selectedPkgIndex];
  addItem(currentProduct, selectedType, selectedPkgIndex, pkg, getSelectedBrand(currentProduct, selectedBrandIndex), selectedBrandIndex);
  closeModal('detailModal');
  showToast(t('toastAdded'));
}
function addItem(p, type, pkgIndex, pkg, brand, brandIndex) {
  const key = `${p.id}-${type}-${pkgIndex}-${brand ? brand.id : 'none'}`;
  const existing = cart.find(i => i.key === key);
  if (existing) { existing.qty++; }
  else { cart.push({ key, id: p.id, type, pkgIndex, pkg, qty: 1, product: p, brand, brandIndex }); }
  updateCartBadge();
}
function updateCartBadge() {
  const total = cart.reduce((s, i) => s + i.qty, 0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = total;
  badge.style.display = total > 0 ? 'flex' : 'none';
}

function openCart() { renderCart(); document.getElementById('cartModal').classList.add('open'); }
function renderCart() {
  const container = document.getElementById('cartItems');
  const totalEl = document.getElementById('cartTotal');
  const orderBtn = document.getElementById('cartOrderBtn');
  document.getElementById('cartTitle').textContent = t('cartTitle');
  document.getElementById('totalLabel').textContent = t('total');
  if (cart.length === 0) {
    container.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🛒</div>${t('emptyCart')}</div>`;
    totalEl.style.display = 'none'; orderBtn.style.display = 'none'; return;
  }
  const typeLabel = type => type === 'powder' ? t('powder') : type === 'chew' ? t('chew') : '';
  container.innerHTML = cart.map(item => {
    const imgUrl = lang === 'ru' ? item.product.imageRu : item.product.imageUz;
    const thumb = imgUrl ? `<img src="${imgUrl}" alt="${item.product[lang].name}">` : item.product.emoji;
    // ── unit savatchada ham to'g'ri chiqadi ──
    const pkgLabel = item.product.hasPackages
      ? `📦 ${item.pkg.qty} ${pkgUnit(item.pkg)}`
      : '';
    const typePart  = typeLabel(item.type) ? ` · ${typeLabel(item.type)}` : '';
    const brandPart = item.brand ? ` · ${item.brand.logo} ${lang === 'ru' ? item.brand.nameRu : item.brand.nameUz}` : '';
    const subInfo   = [pkgLabel, typePart, brandPart].filter(Boolean).join('');
    return `
    <div class="cart-item">
      <div class="cart-item-thumb">${thumb}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.product[lang].name}</div>
        ${subInfo ? `<div class="cart-item-type">${subInfo}</div>` : ''}
      </div>
      <div class="cart-item-right">
        <div class="cart-item-price">${(item.pkg.price * item.qty).toLocaleString()} ${t('currency')}</div>
        <div class="cart-qty-row">
          <button class="cart-qty-btn remove" onclick="changeQty('${item.key}', -1)">−</button>
          <span class="cart-qty-num">${item.qty}</span>
          <button class="cart-qty-btn" onclick="changeQty('${item.key}', +1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
  const total = cart.reduce((s, i) => s + i.pkg.price * i.qty, 0);
  document.getElementById('totalPrice').textContent = `${total.toLocaleString()} ${t('currency')}`;
  totalEl.style.display = 'flex'; orderBtn.style.display = 'block';
}
function changeQty(key, delta) {
  const item = cart.find(i => i.key === key);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(i => i.key !== key);
  updateCartBadge(); renderCart();
}

function openAddrModal() {
  document.getElementById('addrTitle').textContent = t('addrTitle');
  document.getElementById('addrSubtitle').textContent = t('addrSubtitle');
  document.getElementById('addrLocLabel').textContent = t('addrLocLabel');
  document.getElementById('addrPhoneLabel').textContent = t('addrPhoneLabel');
  document.getElementById('addrInput').placeholder = t('addrPlaceholderLoc');
  document.getElementById('phoneInput').placeholder = t('addrPlaceholderPhone');
  document.getElementById('addrConfirmBtn').textContent = t('addrConfirm');
  document.getElementById('addrModal').classList.add('open');
}
function startOrder() {
  if (cart.length === 0) { openCart(); return; }
  closeModal('cartModal'); pendingOrderItems = [...cart]; openAddrModal();
}
function orderNowDetail() {
  if (!currentProduct) return;
  const pkg = currentProduct.packages[selectedPkgIndex];
  const brand = getSelectedBrand(currentProduct, selectedBrandIndex);
  pendingOrderItems = [{
    key: `${currentProduct.id}-${selectedType}-${selectedPkgIndex}-${brand ? brand.id : 'none'}`,
    id: currentProduct.id, type: selectedType, pkgIndex: selectedPkgIndex,
    pkg, qty: 1, product: currentProduct, brand, brandIndex: selectedBrandIndex,
  }];
  closeModal('detailModal'); openAddrModal();
}
function confirmOrder() {
  const location = document.getElementById('addrInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  if (!location) { showToast(t('addrErrorLoc')); return; }
  if (!phone) { showToast(t('addrErrorPhone')); return; }
  sendOrderToBot(pendingOrderItems, location, phone);
  cart = []; updateCartBadge(); closeModal('addrModal');
  document.getElementById('addrInput').value = '';
  document.getElementById('phoneInput').value = '';
  showToast(t('toastOrdering'));
}

function buildOrderPayload(items, location, phone) {
  const user = tg?.initDataUnsafe?.user;
  const typeLabel = (type, l) => {
    if (type === 'powder') return l === 'uz' ? 'Poroshokli' : 'Порошковый';
    if (type === 'chew')   return l === 'uz' ? 'Chaynaladigan' : 'Жевательный';
    return '';
  };
  return {
    user: { id: user?.id||null, username: user?.username||null, firstName: user?.first_name||null, phone },
    delivery: { location, phone },
    items: items.map(i => ({
      id: i.product.id,
      nameUz: i.product.uz.name,
      nameRu: i.product.ru.name,
      qty: i.qty,
      packageQty: i.pkg.qty,
      packageUnit: pkgUnit(i.pkg),   // ← g / ml / dona — botga ham boradi
      type: i.type,
      typeUz: typeLabel(i.type, 'uz'),
      typeRu: typeLabel(i.type, 'ru'),
      pricePerPkg: i.pkg.price,
      subtotal: i.pkg.price * i.qty,
      imageUz: i.product.imageUz || null,
      imageRu: i.product.imageRu || null,
      emoji: i.product.emoji,
      brand: i.brand ? { id: i.brand.id, nameUz: i.brand.nameUz, nameRu: i.brand.nameRu, country: i.brand.country } : null,
    })),
    total: items.reduce((s, i) => s + i.pkg.price * i.qty, 0),
    lang,
  };
}
function sendOrderToBot(items, location, phone) {
  if (!tg) { console.log('Order:', JSON.stringify(buildOrderPayload(items, location, phone), null, 2)); return; }
  tg.sendData(JSON.stringify(buildOrderPayload(items, location, phone)));
}

function handleOverlayClick(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

renderCategories();
renderProducts();
</script>
