<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vitamino_2022</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700&display=swap');

  :root {
    --pink: #F4860A;
    --pink-dark: #D4720A;
    --pink-mid: #F9A84D;
    --pink-light: #FEF0DC;
    --pink-pale: #FFF8F0;
    --purple: #7B5EA7;
    --purple-dark: #6A4D9B;
    --purple-light: #EDE8F5;
    --purple-pale: #F5F2FB;
    --orange: #F4860A;
    --orange-light: #FEF0DC;
    --white: #FFFFFF;
    --gray: #F7F4FB;
    --text: #2C1A4E;
    --text-soft: #8B76A9;
    --card-shadow: 0 4px 20px rgba(123,94,167,0.12);
    --radius: 18px;
    --bottom-bar: 72px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--gray);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(var(--bottom-bar) + 16px);
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #6A4D9B 0%, #7B5EA7 60%, #9B7EC8 100%);
    padding: 20px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(106,77,155,0.40);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .logo {
    font-family: 'Caviar Dreams', serif;
    font-size: 26px;
    font-weight: 700px;
    color: white;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .logo-v {
    font-size: 28px;
    color: #F9C97A;
    font-weight: 700;
  }
  .logo-year {
    color: #F9C97A;
    font-size: 18px;
    letter-spacing: 2px;
  }
  .lang-toggle {
    display: flex;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    padding: 4px 12px;
    border: none;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: rgba(255,255,255,0.7);
  }
  .lang-btn.active { background: white; color: var(--purple-dark); }

  /* ── CATEGORIES ── */
  .categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    white-space: nowrap;
    padding: 6px 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    background: transparent;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .cat-btn.active { background: white; color: var(--purple-dark); border-color: white; }

  /* ── PRODUCT GRID ── */
  .section-title {
    font-size: 16px;
    font-weight: 800;
    padding: 16px 16px 8px;
    color: var(--text);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 16px;
  }
  .card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s;
    position: relative;
    border: 1px solid #E8E0F5;
  }
  .card:active { transform: scale(0.97); }
  .card-img-wrap {
    width: 100%;
    height: 130px;
    background: var(--purple-light);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-img-emoji { font-size: 52px; line-height: 1; }
  .card-body { padding: 10px 12px 12px; }
  .card-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; line-height: 1.2; }
  .card-sub { font-size: 11px; color: var(--text-soft); margin-bottom: 8px; }
  .card-price { font-size: 15px; font-weight: 900; color: var(--purple-dark); }
  .card-add {
    position: absolute;
    bottom: 12px;
    right: 10px;
    width: 28px;
    height: 28px;
    background: var(--purple);
    border-radius: 50%;
    border: none;
    color: white;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(123,94,167,0.4);
    transition: background 0.2s, transform 0.15s;
  }
  .card-add:active { transform: scale(0.9); background: var(--purple-dark); }
  .badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: linear-gradient(135deg, #F9A84D, #F4860A);
    color: white;
    font-size: 10px;
    font-weight: 800;
    border-radius: 8px;
    padding: 2px 7px;
    z-index: 2;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #E8E0F5;
    padding: 10px 16px 12px;
    display: flex;
    gap: 10px;
    z-index: 200;
    box-shadow: 0 -4px 20px rgba(123,94,167,0.12);
  }
  .btn-cart {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    border: 2.5px solid var(--purple);
    background: white;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .btn-cart:active { background: var(--purple-light); }
  .cart-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--orange);
    color: white;
    font-size: 11px;
    font-weight: 900;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .btn-order {
    flex: 1;
    height: 52px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #6A4D9B, #F4860A);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(123,94,167,0.35);
  }
  .btn-order:active { transform: scale(0.98); opacity: 0.92; }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44,26,78,0.55);
    z-index: 300;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding-bottom: 28px;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 36px;
    height: 4px;
    background: #D8D0EE;
    border-radius: 2px;
    margin: 10px auto 16px;
  }

  /* ── DETAIL MODAL IMAGE ── */
  .modal-image-wrap {
    position: relative;
    width: 100%;
    height: 280px;
    background: var(--purple-light);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-in;
  }
  .modal-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
  }
  .modal-image-emoji { font-size: 90px; line-height: 1; }
  .img-lang-pills {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
    z-index: 5;
  }
  .img-lang-pill {
    padding: 4px 13px;
    border-radius: 20px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    background: rgba(255,255,255,0.35);
    color: white;
    backdrop-filter: blur(6px);
    transition: all 0.2s;
  }
  .img-lang-pill.active { background: white; color: var(--purple-dark); }
  .zoom-hint {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(106,77,155,0.7);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }

  /* ── FULLSCREEN IMAGE ZOOM ── */
  .zoom-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.93);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .zoom-overlay.open { display: flex; }
  .zoom-overlay img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 12px;
    touch-action: pinch-zoom;
  }
  .zoom-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    font-size: 26px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }

  .modal-body { padding: 18px 16px 0; }
  .modal-name { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 4px; }
  .modal-price { font-size: 20px; font-weight: 900; color: var(--purple-dark); margin-bottom: 16px; }
  .form-type-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
  .type-options { display: flex; gap: 10px; margin-bottom: 20px; }
  .type-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 14px;
    border: 2px solid #E8E0F5;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    color: var(--text-soft);
  }
  .type-btn.active { border-color: var(--purple); background: var(--purple-light); color: var(--purple-dark); }
  .type-icon { font-size: 20px; display: block; margin-bottom: 4px; }
  .modal-actions { display: flex; gap: 10px; padding: 0 16px; }
  .btn-add-cart {
    flex: 1;
    height: 50px;
    border-radius: 14px;
    border: 2.5px solid var(--purple);
    background: white;
    color: var(--purple-dark);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-add-cart:active { background: var(--purple-light); }
  .btn-order-now {
    flex: 1.4;
    height: 50px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #6A4D9B, #F4860A);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(123,94,167,0.35);
    transition: opacity 0.2s;
  }
  .btn-order-now:active { opacity: 0.88; }

  /* ── ADDRESS MODAL ── */
  .addr-modal {
    background: white;
    border-radius: 24px 24px 0 0;
    width: 100%;
    padding-bottom: 28px;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .addr-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--text);
    padding: 0 16px 16px;
  }
  .addr-subtitle {
    font-size: 13px;
    color: var(--text-soft);
    padding: 0 16px 20px;
    margin-top: -10px;
    line-height: 1.5;
  }
  .addr-field {
    padding: 0 16px 16px;
  }
  .addr-label {
    font-size: 13px;
    font-weight: 800;
    color: var(--purple-dark);
    margin-bottom: 8px;
    display: block;
  }
  .addr-input {
    width: 100%;
    padding: 13px 16px;
    border: 2px solid #E8E0F5;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    background: var(--purple-pale);
  }
  .addr-input:focus { border-color: var(--purple); background: white; }
  .addr-input::placeholder { color: #B0A0CC; }
  .addr-confirm {
    width: calc(100% - 32px);
    margin: 4px 16px 0;
    height: 52px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #6A4D9B, #F4860A);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(123,94,167,0.35);
  }
  .addr-confirm:active { opacity: 0.88; }

  /* ── CART MODAL ── */
  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #EDE8F5;
  }
  .cart-item-thumb {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--purple-light);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .cart-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 14px; font-weight: 800; }
  .cart-item-type { font-size: 12px; color: var(--text-soft); }
  .cart-item-price { font-size: 14px; font-weight: 800; color: var(--purple-dark); white-space: nowrap; }
  .cart-item-remove { background: none; border: none; font-size: 18px; color: var(--orange); cursor: pointer; padding: 4px; }
  .cart-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    font-size: 16px;
    font-weight: 900;
    background: var(--purple-pale);
    margin: 8px 16px;
    border-radius: 14px;
  }
  .cart-empty {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-soft);
    font-size: 15px;
  }
  .cart-empty-icon { font-size: 50px; margin-bottom: 12px; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--orange);
    color: white;
    padding: 12px 20px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(106,77,155,0.35);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* input number arrows hide */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="logo"><span class="logo-v">V</span>itamino<span class="logo-year">_2022</span> 🌿</div>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('uz')">UZ</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
    </div>
  </div>
  <div class="categories" id="categories"></div>
</div>

<!-- PRODUCTS -->
<div class="section-title" id="sectionTitle">Barcha vitaminlar</div>
<div class="grid" id="grid"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="btn-cart" onclick="openCart()">
    🛒
    <span class="cart-badge" id="cartBadge">0</span>
  </button>
  <button class="btn-order" id="orderBtn" onclick="startOrder()">📦 Buyurtma berish</button>
</div>

<!-- PRODUCT DETAIL MODAL -->
<div class="modal-overlay" id="detailModal" onclick="handleOverlayClick(event,'detailModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-image-wrap" id="modalImageWrap" onclick="openZoom()">
      <div class="img-lang-pills">
        <button class="img-lang-pill active" id="imgLangUz" onclick="event.stopPropagation();setImgLang('uz')">🇺🇿 UZ</button>
        <button class="img-lang-pill" id="imgLangRu" onclick="event.stopPropagation();setImgLang('ru')">🇷🇺 RU</button>
      </div>
      <div class="zoom-hint" id="zoomHint">🔍 Rasm bosing — zoom</div>
    </div>
    <div class="modal-body">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-price" id="modalPrice"></div>
      <div id="typeBlock">
        <div class="form-type-title" id="formTypeTitle">Shaklini tanlang:</div>
        <div class="type-options">
          <button class="type-btn active" id="typePowder" onclick="selectType('powder')">
            <span class="type-icon">🧪</span>
            <span id="typePowderLabel">Poroshokli</span>
          </button>
          <button class="type-btn" id="typeChew" onclick="selectType('chew')">
            <span class="type-icon">🍬</span>
            <span id="typeChewLabel">Chaynaladigan</span>
          </button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-add-cart" id="btnAddCart" onclick="addToCart()">🛒 Savatga</button>
      <button class="btn-order-now" id="btnOrderNow" onclick="orderNowDetail()">⚡ Hozir buyurtma</button>
    </div>
  </div>
</div>

<!-- FULLSCREEN ZOOM -->
<div class="zoom-overlay" id="zoomOverlay" onclick="closeZoom()">
  <button class="zoom-close" onclick="closeZoom()">✕</button>
  <img id="zoomImg" src="" alt="">
</div>

<!-- CART MODAL -->
<div class="modal-overlay" id="cartModal" onclick="handleOverlayClick(event,'cartModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="padding: 0 16px 12px; font-size: 18px; font-weight: 900;" id="cartTitle">🛒 Savat</div>
    <div id="cartItems"></div>
    <div class="cart-total" id="cartTotal" style="display:none">
      <span id="totalLabel">Jami:</span>
      <span id="totalPrice" style="color:var(--purple-dark)"></span>
    </div>
    <div style="padding: 0 16px; display:none" id="cartOrderBtn">
      <button class="btn-order-now" style="width:100%; height:52px; font-size:16px" onclick="startOrder()">📦 Buyurtma berish</button>
    </div>
  </div>
</div>

<!-- ADDRESS MODAL -->
<div class="modal-overlay" id="addrModal" onclick="handleOverlayClick(event,'addrModal')">
  <div class="addr-modal">
    <div class="modal-handle"></div>
    <div class="addr-title" id="addrTitle">📍 Yetkazib berish ma'lumotlari</div>
    <div class="addr-subtitle" id="addrSubtitle">Buyurtmangizni to'g'ri yetkazib berish uchun ma'lumot kiriting</div>
    <div class="addr-field">
      <label class="addr-label" id="addrLocLabel">📍 Manzil (ko'cha, uy raqami)</label>
      <input class="addr-input" id="addrInput" type="text" placeholder="Masalan: Chilonzor 4-daha, 12-uy">
    </div>
    <div class="addr-field">
      <label class="addr-label" id="addrPhoneLabel">📞 Telefon raqam</label>
      <input class="addr-input" id="phoneInput" type="tel" placeholder="+998 90 123 45 67">
    </div>
    <button class="addr-confirm" id="addrConfirmBtn" onclick="confirmOrder()">✅ Buyurtmani tasdiqlash</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ─── TRANSLATIONS ───
const translations = {
  uz: {
    allVit: 'Barcha vitaminlar',
    orderBtn: '📦 Buyurtma berish',
    cartTitle: '🛒 Savat',
    formType: 'Shaklini tanlang:',
    powder: 'Poroshokli',
    chew: 'Chaynaladigan',
    addCart: '🛒 Savatga',
    orderNow: '⚡ Hozir buyurtma',
    total: 'Jami:',
    emptyCart: "Savat bo'sh",
    toastAdded: "✅ Savatga qo'shildi!",
    toastOrdering: '✅ Buyurtma yuborildi!',
    currency: "so'm",
    addrTitle: "📍 Yetkazib berish ma'lumotlari",
    addrSubtitle: "Buyurtmangizni to'g'ri yetkazib berish uchun ma'lumot kiriting",
    addrLocLabel: "📍 Manzil (ko'cha, uy raqami)",
    addrPhoneLabel: "📞 Telefon raqam",
    addrPlaceholderLoc: "Masalan: Chilonzor 4-daha, 12-uy",
    addrPlaceholderPhone: "+998 90 123 45 67",
    addrConfirm: "✅ Buyurtmani tasdiqlash",

const products = [
  // hasTypes: true = parashok/chaynaladigan tanlash chiqadi
  // hasImageRu: true = RU tilida ham rasm bor, false = RU da emoji chiqadi
  { id:1, emoji:'🍊', cat:1, hasTypes:true, hasImageRu:false,
    uz:{name:'Vitamin C', sub:'Immunitet kuchaytirgich'},

];

let lang = 'uz';
let selectedCat = 0;
let currentProduct = null;
let imgLang = 'uz';
let selectedType = 'powder';
let cart = [];
let pendingOrderItems = null;

// ─── LANGUAGE ───
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === l.toUpperCase())
  );
  renderCategories();
  renderProducts();
  updateStaticText();
}
function t(key) { return translations[lang][key]; }
function updateStaticText() {
  document.getElementById('orderBtn').textContent = t('orderBtn');
  document.getElementById('cartTitle').textContent = t('cartTitle');
  document.getElementById('sectionTitle').textContent = t('allVit');
  if (currentProduct) populateModal(currentProduct);
}

// ─── CATEGORIES ───
function renderCategories() {
  const cats = categories[lang];
  document.getElementById('categories').innerHTML = cats.map((c, i) =>
    `<button class="cat-btn ${selectedCat===i?'active':''}" onclick="selectCat(${i})">${c}</button>`
  ).join('');
}
function selectCat(i) {
  selectedCat = i;
  renderCategories();
  renderProducts();
}

// ─── PRODUCTS ───
function renderProducts() {
  const filtered = selectedCat === 0 ? products : products.filter(p => p.cat === selectedCat);
  document.getElementById('grid').innerHTML = filtered.map(p => {
    const info = p[lang];
    const imgUrl = lang === 'ru' ? p.imageRu : p.imageUz;
    const imgTag = imgUrl
      ? `<img src="${imgUrl}" alt="${info.name}" style="width:100%;height:100%;object-fit:cover;">`
      : `<span class="card-img-emoji">${p.emoji}</span>`;
    return `
    <div class="card" onclick="openDetail(${p.id})">
      ${p.badge ? `<div class="badge">${p.badge}</div>` : ''}
      <div class="card-img-wrap">${imgTag}</div>
      <div class="card-body">
        <div class="card-name">${info.name}</div>
        <div class="card-sub">${info.sub}</div>
        <div class="card-price">${p.price.toLocaleString()} ${t('currency')}</div>
      </div>
      <button class="card-add" onclick="quickAdd(event,${p.id})">+</button>
    </div>`;
  }).join('');
}

// ─── MODAL IMAGE ───
function renderModalImage(p, il) {
  const wrap = document.getElementById('modalImageWrap');
  const pills = wrap.querySelector('.img-lang-pills');
  const hint = wrap.querySelector('.zoom-hint');
  wrap.innerHTML = '';
  wrap.appendChild(pills);
  wrap.appendChild(hint);

  // RU tilida rasm faqat hasImageRu:true bo'lsa ishlatiladi
  let url = null;
  if (il === 'ru') {
    url = p.hasImageRu ? p.imageRu : null;
  } else {
    url = p.imageUz;
  }

  // RU lang pill — faqat hasImageRu:true bo'lsa ko'rinadi
  const ruPill = document.getElementById('imgLangRu');
  if (ruPill) {
    ruPill.style.display = p.hasImageRu ? '' : 'none';
  }

  if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = p[il].name;
    img.id = 'modalImg';
    img.onerror = () => {
      img.remove();
      const em = document.createElement('div');
      em.className = 'modal-image-emoji';
      em.textContent = p.emoji;
      wrap.insertBefore(em, pills);
      hint.style.display = 'none';
    };
    wrap.insertBefore(img, pills);
    hint.style.display = '';
  } else {
    const em = document.createElement('div');
    em.className = 'modal-image-emoji';
    em.textContent = p.emoji;
    wrap.insertBefore(em, pills);
    hint.style.display = 'none';
  }
}

// ─── ZOOM ───
function openZoom() {
  const img = document.getElementById('modalImg');
  if (!img) return;
  document.getElementById('zoomImg').src = img.src;
  document.getElementById('zoomOverlay').classList.add('open');
}
function closeZoom() {
  document.getElementById('zoomOverlay').classList.remove('open');
}

// ─── DETAIL MODAL ───
function openDetail(id) {
  currentProduct = products.find(p => p.id === id);
  imgLang = lang;
  selectedType = currentProduct.hasTypes ? 'powder' : 'none';
  populateModal(currentProduct);
  document.getElementById('detailModal').classList.add('open');
}
function populateModal(p) {
  renderModalImage(p, imgLang);
  document.getElementById('modalName').textContent = p[imgLang].name;
  document.getElementById('modalPrice').textContent = `${p.price.toLocaleString()} ${t('currency')}`;
  document.getElementById('btnAddCart').textContent = t('addCart');
  document.getElementById('btnOrderNow').textContent = t('orderNow');
  document.getElementById('imgLangUz').classList.toggle('active', imgLang === 'uz');
  document.getElementById('imgLangRu').classList.toggle('active', imgLang === 'ru');
  const hint = document.getElementById('zoomHint');
  if (hint) hint.textContent = t('zoomHint');

  // hasTypes: faqat kerakli mahsulotda shakl tanlash chiqadi
  const typeBlock = document.getElementById('typeBlock');
  if (p.hasTypes) {
    typeBlock.style.display = '';
    document.getElementById('formTypeTitle').textContent = t('formType');
    document.getElementById('typePowderLabel').textContent = t('powder');
    document.getElementById('typeChewLabel').textContent = t('chew');
    document.getElementById('typePowder').classList.toggle('active', selectedType === 'powder');
    document.getElementById('typeChew').classList.toggle('active', selectedType === 'chew');
  } else {
    typeBlock.style.display = 'none';
    selectedType = 'none';
  }
}
function setImgLang(l) {
  imgLang = l;
  if (currentProduct) populateModal(currentProduct);
}
function selectType(type) {
  selectedType = type;
  document.getElementById('typePowder').classList.toggle('active', type === 'powder');
  document.getElementById('typeChew').classList.toggle('active', type === 'chew');
}

// ─── CART ───
function quickAdd(e, id) {
  e.stopPropagation();
  const p = products.find(x => x.id === id);
  addItem(p, p.hasTypes ? 'powder' : 'none');
  showToast(t('toastAdded'));
}
function addToCart() {
  if (!currentProduct) return;
  addItem(currentProduct, selectedType);
  closeModal('detailModal');
  showToast(t('toastAdded'));
}
function addItem(p, type) {
  const key = `${p.id}-${type}`;
  const existing = cart.find(i => i.key === key);
  if (existing) existing.qty++;
  else cart.push({ key, id: p.id, type, qty: 1, product: p });
  updateCartBadge();
}
function updateCartBadge() {
  const total = cart.reduce((s, i) => s + i.qty, 0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = total;
  badge.style.display = total > 0 ? 'flex' : 'none';
}
function openCart() {
  renderCart();
  document.getElementById('cartModal').classList.add('open');
}
function renderCart() {
  const container = document.getElementById('cartItems');
  const totalEl = document.getElementById('cartTotal');
  const orderBtn = document.getElementById('cartOrderBtn');
  document.getElementById('cartTitle').textContent = t('cartTitle');
  document.getElementById('totalLabel').textContent = t('total');
  if (cart.length === 0) {
    container.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🛒</div>${t('emptyCart')}</div>`;
    totalEl.style.display = 'none';
    orderBtn.style.display = 'none';
    return;
  }
  const typeLabel = type => type === 'powder' ? t('powder') : type === 'chew' ? t('chew') : '';
  container.innerHTML = cart.map(item => {
    const imgUrl = lang === 'ru' ? item.product.imageRu : item.product.imageUz;
    const thumb = imgUrl
      ? `<img src="${imgUrl}" alt="${item.product[lang].name}">`
      : item.product.emoji;
    return `
    <div class="cart-item">
      <div class="cart-item-thumb">${thumb}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.product[lang].name} × ${item.qty}</div>
        <div class="cart-item-type">${typeLabel(item.type)}</div>
      </div>
      <div class="cart-item-price">${(item.product.price * item.qty).toLocaleString()} ${t('currency')}</div>
      <button class="cart-item-remove" onclick="removeItem('${item.key}')">🗑</button>
    </div>`;
  }).join('');
  const total = cart.reduce((s, i) => s + i.product.price * i.qty, 0);
  document.getElementById('totalPrice').textContent = `${total.toLocaleString()} ${t('currency')}`;
  totalEl.style.display = 'flex';
  orderBtn.style.display = 'block';
}
function removeItem(key) {
  cart = cart.filter(i => i.key !== key);
  updateCartBadge();
  renderCart();
}

// ─── ADDRESS MODAL ───
function openAddrModal() {
  document.getElementById('addrTitle').textContent = t('addrTitle');
  document.getElementById('addrSubtitle').textContent = t('addrSubtitle');
  document.getElementById('addrLocLabel').textContent = t('addrLocLabel');
  document.getElementById('addrPhoneLabel').textContent = t('addrPhoneLabel');
  document.getElementById('addrInput').placeholder = t('addrPlaceholderLoc');
  document.getElementById('phoneInput').placeholder = t('addrPlaceholderPhone');
  document.getElementById('addrConfirmBtn').textContent = t('addrConfirm');
  document.getElementById('addrModal').classList.add('open');
}

function startOrder() {
  if (cart.length === 0) { openCart(); return; }
  closeModal('cartModal');
  pendingOrderItems = [...cart];
  openAddrModal();
}

function orderNowDetail() {
  if (!currentProduct) return;
  pendingOrderItems = [{
    key: `${currentProduct.id}-${selectedType}`,
    id: currentProduct.id,
    type: selectedType,
    qty: 1,
    product: currentProduct
  }];
  closeModal('detailModal');
  openAddrModal();
}

function confirmOrder() {
  const location = document.getElementById('addrInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  if (!location) { showToast(t('addrErrorLoc')); return; }
  if (!phone) { showToast(t('addrErrorPhone')); return; }
  sendOrderToBot(pendingOrderItems, location, phone);
  cart = [];
  updateCartBadge();
  closeModal('addrModal');
  document.getElementById('addrInput').value = '';
  document.getElementById('phoneInput').value = '';
  showToast(t('toastOrdering'));
}

// ─── ORDER PAYLOAD ───
function buildOrderPayload(items, location, phone) {
  const user = tg?.initDataUnsafe?.user;
  return {
    user: {
      id:        user?.id || null,
      username:  user?.username || null,
      firstName: user?.first_name || null,
      phone:     phone,
    },
    delivery: { location, phone },
    items: items.map(i => ({
      id:       i.product.id,
      nameUz:   i.product.uz.name,
      nameRu:   i.product.ru.name,
      qty:      i.qty,
      type:     i.type,
      price:    i.product.price,
      subtotal: i.product.price * i.qty,
      imageUz:  i.product.imageUz || null,
      imageRu:  i.product.imageRu || null,
      emoji:    i.product.emoji,
    })),
    total: items.reduce((s, i) => s + i.product.price * i.qty, 0),
    lang: lang,
  };
}

function sendOrderToBot(items, location, phone) {
  if (!tg) { console.log('Order:', buildOrderPayload(items, location, phone)); return; }
  const payload = buildOrderPayload(items, location, phone);
  tg.sendData(JSON.stringify(payload));
}

// ─── HELPERS ───
function handleOverlayClick(e, id) {
  if (e.target === document.getElementById(id)) closeModal(id);
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── INIT ──
renderCategories();
renderProducts();
