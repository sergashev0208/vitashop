<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VitaShop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blush:       #F2AABB;
  --blush-deep:  #D4849A;
  --blush-dark:  #B5657A;
  --rose:        #C4718A;
  --petal:       #FDE8EF;
  --petal-light: #FFF4F7;
  --cream:       #FFFAF9;
  --text-dark:   #3A1A26;
  --text-mid:    #7A4A5A;
  --text-soft:   #B4889A;
  --card-bg:     #FFFFFF;
  --border:      rgba(212,132,154,0.18);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'Jost',sans-serif;
  background:var(--petal-light);
  color:var(--text-dark);
  min-height:100vh;
  padding-bottom:110px;
  overflow-x:hidden;
}

/* ── HEADER ── */
.header {
  background:linear-gradient(160deg, #f7c5d0 0%, #eea0b8 50%, #d98aa5 100%);
  padding:22px 20px 26px;
  position:relative; overflow:hidden;
}
.header::before {
  content:''; position:absolute; inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.07'%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.header-top {
  display:flex; align-items:center; gap:12px;
  margin-bottom:16px; position:relative; z-index:1;
}
.logo-wrap {
  width:46px; height:46px;
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(10px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.5);
  display:flex; align-items:center; justify-content:center;
  font-size:22px; flex-shrink:0;
}
.brand-name {
  font-family:'Cormorant Garamond',serif;
  font-size:26px; font-weight:700;
  color:#fff; letter-spacing:0.5px;
}
.brand-sub { font-size:12px; color:rgba(255,255,255,0.8); font-weight:400; letter-spacing:1px; text-transform:uppercase; }
.cart-btn {
  margin-left:auto; position:relative;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.4);
  border-radius:14px; width:46px; height:46px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; cursor:pointer;
}
.cart-badge {
  position:absolute; top:-5px; right:-5px;
  background:#fff; color:var(--blush-dark);
  font-size:10px; font-weight:700;
  width:18px; height:18px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
}
.search-bar {
  position:relative; z-index:1;
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.45);
  border-radius:16px;
  display:flex; align-items:center;
  padding:12px 16px; gap:10px;
}
.search-bar input {
  background:none; border:none; outline:none;
  color:#fff; font-size:14px; font-family:'Jost',sans-serif;
  width:100%; font-weight:500;
}
.search-bar input::placeholder { color:rgba(255,255,255,0.7); }

/* ── CATEGORIES ── */
.section-label {
  font-size:11px; font-weight:600; color:var(--text-soft);
  letter-spacing:2px; text-transform:uppercase;
  padding:20px 20px 10px;
}
.categories-scroll {
  display:flex; gap:8px; padding:0 20px 4px;
  overflow-x:auto; scrollbar-width:none;
}
.categories-scroll::-webkit-scrollbar { display:none; }
.cat-chip {
  display:flex; align-items:center; gap:6px;
  padding:9px 18px; border-radius:50px;
  font-size:13px; font-weight:600; white-space:nowrap;
  cursor:pointer; transition:all 0.22s;
  background:var(--card-bg); color:var(--text-mid);
  border:1.5px solid var(--border);
}
.cat-chip.active {
  background:linear-gradient(135deg,var(--blush),var(--rose));
  color:#fff; border-color:transparent;
  box-shadow:0 4px 14px rgba(196,113,138,0.3);
}

/* ── PRODUCTS GRID ── */
.products-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:14px; padding:10px 20px;
}
.product-card {
  background:var(--card-bg); border-radius:22px; overflow:hidden;
  box-shadow:0 2px 16px rgba(180,100,130,0.1);
  border:1px solid var(--border);
  cursor:pointer; transition:transform 0.2s;
}
.product-card:active { transform:scale(0.97); }
.product-thumb {
  width:100%; height:120px;
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  background:var(--petal);
}
.product-thumb img {
  width:100%; height:100%; object-fit:cover;
}
.product-thumb .fallback-emoji {
  font-size:48px; position:relative; z-index:1;
}

/* Price overlay */
.price-overlay {
  position:absolute;
  bottom:0; left:0; right:0; z-index:3;
  background:linear-gradient(to top, rgba(58,26,38,0.65) 0%, transparent 100%);
  padding:20px 10px 8px;
  display:flex; align-items:flex-end; justify-content:space-between;
}
.price-overlay-amount {
  font-family:'Cormorant Garamond',serif;
  font-size:16px; font-weight:700; color:#fff;
  line-height:1;
}
.price-overlay-amount small { font-size:10px; font-weight:400; opacity:0.85; }
.price-overlay-add {
  width:28px; height:28px;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,0.5);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:17px; color:#fff; cursor:pointer;
  flex-shrink:0; line-height:1;
  transition:all 0.18s;
}
.price-overlay-add:active { transform:scale(0.85); }
.price-overlay-add.added {
  background:rgba(255,255,255,0.9);
  color:var(--blush-dark);
  border-color:transparent;
}

.product-info { padding:10px 12px 13px; }
.product-name { font-size:13px; font-weight:600; color:var(--text-dark); line-height:1.3; margin-bottom:2px; }
.product-cat  { font-size:11px; color:var(--text-soft); font-weight:500; letter-spacing:0.3px; }

/* ══════════════════════════════════
   PRODUCT DETAIL MODAL
══════════════════════════════════ */
.detail-overlay {
  position:fixed; inset:0;
  background:rgba(58,26,38,0.5);
  backdrop-filter:blur(8px);
  z-index:200; opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.detail-overlay.visible { opacity:1; pointer-events:all; }

.detail-modal {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--cream);
  border-radius:28px 28px 0 0;
  z-index:201; max-height:90vh;
  display:flex; flex-direction:column;
  transform:translateY(100%);
  transition:transform 0.38s cubic-bezier(0.34,1.2,0.64,1);
  overflow:hidden;
}
.detail-modal.open { transform:translateY(0); }

/* Swiper */
.swiper-wrap {
  position:relative; width:100%; height:270px;
  overflow:hidden; flex-shrink:0;
  background:var(--petal); touch-action:pan-y;
}
.swiper-track {
  display:flex; height:100%;
  transition:transform 0.35s cubic-bezier(0.25,0.8,0.25,1);
  will-change:transform;
}
.swiper-slide {
  min-width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
.swiper-slide img { width:100%; height:100%; object-fit:cover; }
.swiper-slide .big-emoji { font-size:100px; line-height:1; }

/* Language pill */
.lang-pill {
  position:absolute; top:14px; left:14px;
  display:flex; gap:6px; z-index:10;
}
.lang-dot {
  padding:5px 12px; border-radius:50px;
  font-size:11px; font-weight:600;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(8px);
  color:var(--text-mid);
  border:1px solid rgba(255,255,255,0.6);
  transition:all 0.2s;
}
.lang-dot.active {
  background:rgba(242,170,187,0.9);
  color:#fff; border-color:transparent;
}

.swipe-hint {
  position:absolute; right:14px; bottom:50px;
  background:rgba(255,255,255,0.8); backdrop-filter:blur(8px);
  border-radius:50px; padding:5px 12px;
  font-size:11px; font-weight:600; color:var(--text-mid);
  display:flex; align-items:center; gap:4px;
  animation:hint 2s ease-in-out 1s 3;
}
@keyframes hint { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
.swipe-hint.hidden { display:none; }

.swiper-dots {
  position:absolute; bottom:14px; left:50%;
  transform:translateX(-50%);
  display:flex; gap:5px; z-index:10;
}
.swiper-dot {
  width:6px; height:6px; border-radius:50%;
  background:rgba(255,255,255,0.5); transition:all 0.25s;
}
.swiper-dot.active { background:#fff; width:16px; border-radius:3px; }

/* Price ribbon */
.detail-price-ribbon {
  position:absolute; bottom:0; left:0; right:0; z-index:12;
  background:linear-gradient(to top, rgba(58,26,38,0.6) 0%, transparent 100%);
  padding:28px 18px 14px;
  pointer-events:none;
}
.detail-ribbon-price {
  font-family:'Cormorant Garamond',serif;
  font-size:28px; font-weight:700; color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,0.2);
}
.detail-ribbon-price small { font-size:14px; font-weight:400; margin-left:4px; opacity:0.85; }

/* Detail body */
.detail-body {
  flex:1; overflow-y:auto; padding:22px 22px 0;
  scrollbar-width:none;
}
.detail-body::-webkit-scrollbar { display:none; }
.detail-name {
  font-family:'Cormorant Garamond',serif;
  font-size:24px; font-weight:700; color:var(--text-dark);
  line-height:1.2; margin-bottom:4px;
}
.detail-name-ru {
  font-size:13px; color:var(--text-soft); font-weight:400;
  font-style:italic; margin-bottom:10px;
}
.detail-cat-tag {
  display:inline-block;
  font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase;
  padding:4px 12px; border-radius:50px;
  background:var(--petal); color:var(--rose);
  margin-bottom:14px;
}
.detail-footer {
  padding:16px 20px 32px; flex-shrink:0;
  background:var(--cream);
  border-top:1px solid var(--border);
}
.detail-add-btn {
  width:100%;
  background:linear-gradient(135deg,var(--blush),var(--blush-dark));
  color:#fff; border:none; border-radius:18px;
  padding:16px; font-size:16px; font-weight:600;
  font-family:'Jost',sans-serif;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 8px 24px rgba(196,113,138,0.3);
  transition:all 0.2s; letter-spacing:0.5px;
}
.detail-add-btn:active { transform:scale(0.97); }
.detail-add-btn.added {
  background:linear-gradient(135deg,#e8a0b0,var(--rose));
}
.detail-close-btn {
  position:absolute; top:16px; right:16px; z-index:20;
  width:34px; height:34px;
  background:rgba(255,255,255,0.85); backdrop-filter:blur(8px);
  border-radius:50%; border:none;
  font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-mid);
}

/* ── CART DRAWER ── */
.overlay {
  position:fixed; inset:0;
  background:rgba(58,26,38,0.45);
  backdrop-filter:blur(4px);
  z-index:100; opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.overlay.visible { opacity:1; pointer-events:all; }
.cart-drawer {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--cream); border-radius:28px 28px 0 0;
  padding:0 0 32px; z-index:101; max-height:85vh;
  display:flex; flex-direction:column;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1);
  box-shadow:0 -10px 40px rgba(180,100,130,0.15);
}
.cart-drawer.open { transform:translateY(0); }
.drawer-handle { width:36px; height:4px; background:var(--blush); border-radius:2px; margin:14px auto 0; flex-shrink:0; opacity:0.5; }
.drawer-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; flex-shrink:0; }
.drawer-title { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:700; color:var(--text-dark); }
.close-drawer { width:32px; height:32px; background:var(--petal); border-radius:50%; border:none; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-mid); }
.cart-items { flex:1; overflow-y:auto; padding:0 20px; scrollbar-width:none; }
.cart-items::-webkit-scrollbar { display:none; }
.cart-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.cart-item-img {
  width:48px; height:48px; border-radius:14px;
  overflow:hidden; flex-shrink:0;
  background:var(--petal);
  display:flex; align-items:center; justify-content:center;
  font-size:24px;
}
.cart-item-img img { width:100%; height:100%; object-fit:cover; }
.cart-item-info { flex:1; }
.cart-item-name { font-size:13px; font-weight:600; color:var(--text-dark); }
.cart-item-price { font-size:12px; color:var(--text-soft); margin-top:2px; }
.cart-qty-ctrl { display:flex; align-items:center; gap:8px; }
.qty-btn { width:28px; height:28px; border-radius:9px; border:none; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; }
.qty-minus { background:var(--petal); color:var(--rose); }
.qty-plus { background:linear-gradient(135deg,var(--blush),var(--rose)); color:#fff; }
.qty-num { font-size:15px; font-weight:700; color:var(--text-dark); min-width:18px; text-align:center; }
.cart-footer { padding:16px 20px 0; flex-shrink:0; }
.note-input {
  width:100%; background:var(--petal); border:1.5px solid var(--border);
  border-radius:14px; padding:11px 14px; font-size:13px;
  font-family:'Jost',sans-serif; color:var(--text-dark);
  resize:none; outline:none; margin-bottom:12px;
}
.note-input:focus { border-color:var(--blush); }
.cart-total { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.cart-total-label { font-size:14px; color:var(--text-soft); font-weight:500; }
.cart-total-price { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:700; color:var(--text-dark); }
.empty-cart { text-align:center; padding:40px 20px; color:var(--text-soft); }
.empty-cart div:first-child { font-size:50px; margin-bottom:10px; }
.empty-cart p { font-weight:500; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  position:fixed; bottom:0; left:0; right:0;
  padding:12px 20px 28px;
  background:linear-gradient(to top,var(--petal-light) 70%,transparent);
  z-index:50;
  display:flex; gap:10px;
}
.cart-icon-btn {
  width:54px; height:54px; flex-shrink:0;
  background:var(--card-bg);
  border:1.5px solid var(--border);
  border-radius:18px;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; cursor:pointer; position:relative;
  box-shadow:0 4px 16px rgba(180,100,130,0.12);
}
.cart-icon-badge {
  position:absolute; top:-5px; right:-5px;
  background:var(--blush-dark); color:#fff;
  font-size:9px; font-weight:700;
  width:17px; height:17px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
}
.order-btn {
  flex:1;
  background:linear-gradient(135deg,var(--blush) 0%,var(--blush-dark) 100%);
  color:#fff; border:none; border-radius:18px;
  padding:0 20px; height:54px;
  font-size:15px; font-weight:600;
  font-family:'Jost',sans-serif; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 6px 20px rgba(196,113,138,0.35);
  transition:all 0.25s; letter-spacing:0.5px;
  position:relative; overflow:hidden;
}
.order-btn::after {
  content:''; position:absolute;
  top:0; left:-100%; width:50%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  animation:shimmer 3.5s infinite;
}
@keyframes shimmer { 0%{left:-100%} 60%,100%{left:150%} }
.order-btn-count {
  background:rgba(255,255,255,0.25); width:24px; height:24px;
  border-radius:50%; display:none; align-items:center; justify-content:center;
  font-size:12px; font-weight:700;
}

/* ── TOAST ── */
.toast {
  position:fixed; top:20px; left:50%;
  transform:translateX(-50%) translateY(-80px);
  background:var(--text-dark); color:#fff;
  padding:10px 20px; border-radius:50px;
  font-size:13px; font-weight:500; z-index:300;
  transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1);
  white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="logo-wrap">🌸</div>
    <div>
      <div class="brand-name">VitaShop</div>
      <div class="brand-sub">Sog'liq do'koni</div>
    </div>

  </div>
  <div class="search-bar">
    <span>🔍</span>
    <input type="text" placeholder="Vitamin qidiring..." oninput="filterProducts(this.value)">
  </div>
</div>

<!-- CATEGORIES -->
<div class="section-label">Kategoriyalar</div>
<div class="categories-scroll" id="catList"></div>

<!-- PRODUCTS -->
<div class="section-label" style="padding-top:16px">Mahsulotlar</div>
<div class="products-grid" id="productsGrid"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="cart-icon-btn" onclick="openCart()">
    🛒
    <div class="cart-icon-badge" id="cartIconBadge">0</div>
  </div>
  <button class="order-btn" id="orderBtn" onclick="openCart()">
    <span>Savatni Ko'rish</span>
    <span class="order-btn-count" id="orderCount">0</span>
  </button>
</div>

<!-- CART OVERLAY + DRAWER -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <div class="drawer-title">🛒 Savatcha</div>
    <button class="close-drawer" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <textarea class="note-input" id="noteInput" placeholder="📝 Izoh yoki manzil yozing..." rows="2"></textarea>
    <div class="cart-total">
      <span class="cart-total-label">Jami summa:</span>
      <span class="cart-total-price" id="totalPrice">0 so'm</span>
    </div>
    <button class="order-btn" style="animation:none;border-radius:16px;height:52px" onclick="sendOrder()">
      <span>✅</span><span>Buyurtma Berish</span>
    </button>
  </div>
</div>

<!-- PRODUCT DETAIL MODAL -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-modal" id="detailModal">
  <button class="detail-close-btn" onclick="closeDetail()">✕</button>
  <div class="swiper-wrap" id="swiperWrap">
    <div class="swiper-track" id="swiperTrack"></div>
    <div class="lang-pill">
      <div class="lang-dot active" id="langDot0">🇺🇿 O'zbekcha</div>
      <div class="lang-dot"        id="langDot1">🇷🇺 Русский</div>
    </div>
    <div class="swipe-hint" id="swipeHint">Swipe →</div>
    <div class="swiper-dots" id="swiperDots"></div>
    <div class="detail-price-ribbon">
      <div class="detail-ribbon-price" id="ribbonPrice"></div>
    </div>
  </div>
  <div class="detail-body">
    <div class="detail-cat-tag" id="dCat"></div>
    <div class="detail-name" id="dName"></div>
    <div class="detail-name-ru" id="dNameRu"></div>
    <div style="height:20px"></div>
  </div>
  <div class="detail-footer">
    <button class="detail-add-btn" id="detailAddBtn" onclick="detailAddToCart()">
      <span>🛒</span><span id="detailAddLabel">Savatchaga qo'shish</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }

const categories = [
  { id:'all',      icon:'🌸', label:'Barchasi'       },
  { id:'vitamin',  icon:'💊', label:'Vitaminlar'      },
  { id:'mineral',  icon:'⚗️', label:'Minerallar'      },
  { id:'omega',    icon:'🐟', label:'Omega'           },
  { id:'probiotic',icon:'🦠', label:'Probiotiklar'    },
  { id:'sport',    icon:'💪', label:'Sport'           },
  { id:'immune',   icon:'🛡️', label:'Immunitet'       },
];

const products = [
  {
    id:1, cat:'vitamin', emoji:'🌟', name:'Vitamin C 1000mg', nameRu:'Витамин C 1000мг',

let cart = {};
let activeCategory = 'all';
let searchQuery = '';
let currentDetailId = null;

function renderCategories() {
  document.getElementById('catList').innerHTML = categories.map(c => `
    <div class="cat-chip ${c.id===activeCategory?'active':''}" onclick="selectCat('${c.id}')">
      ${c.icon} ${c.label}
    </div>`).join('');
}

function getBg(cat) {
  const m = {
    vitamin:'linear-gradient(135deg,#fde8ef,#f9c5d4)',
    mineral:'linear-gradient(135deg,#fde8ef,#f5c4d8)',
    omega:'linear-gradient(135deg,#fce8f3,#f5c4e4)',
    probiotic:'linear-gradient(135deg,#fdeef5,#f9d0e3)',
    sport:'linear-gradient(135deg,#fde8f5,#f5c4e0)',
    immune:'linear-gradient(135deg,#fdeaf0,#f9c8d8)',
  };
  return m[cat]||'linear-gradient(135deg,#fde8ef,#f9c5d4)';
}

function renderProducts() {
  const filtered = products.filter(p => {
    const mc = activeCategory==='all' || p.cat===activeCategory;
    const ms = p.name.toLowerCase().includes(searchQuery.toLowerCase());
    return mc && ms;
  });
  const el = document.getElementById('productsGrid');
  if(!filtered.length){
    el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--text-soft);font-weight:500;">Hech narsa topilmadi</div>';
    return;
  }
  el.innerHTML = filtered.map(p => {
    const inCart = cart[p.id]>0;
    const bg = getBg(p.cat);
    const imgUrl = p.images && p.images[0];
    const catLabel = categories.find(c=>c.id===p.cat)?.label || '';
    return `
      <div class="product-card" onclick="openDetail(${p.id})">
        <div class="product-thumb" style="background:${bg}">
          ${imgUrl ? `<img src="${imgUrl}" alt="${p.name}" onerror="this.style.display='none'">` : `<span class="fallback-emoji">${p.emoji}</span>`}
          <div class="price-overlay">
            <div class="price-overlay-amount">${p.price.toLocaleString('uz-UZ')}<small> so'm</small></div>
            <button class="price-overlay-add ${inCart?'added':''}" id="addbtn-${p.id}"
              onclick="event.stopPropagation();addToCart(${p.id})">${inCart?'✓':'+'}</button>
          </div>
        </div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-cat">${catLabel}</div>
        </div>
      </div>`;
  }).join('');
}

function selectCat(id){ activeCategory=id; renderCategories(); renderProducts(); }
function filterProducts(v){ searchQuery=v; renderProducts(); }

/* ── DETAIL + SWIPER ── */
let swipeStartX=0, swipeCurrentX=0, swipeDragging=false, swipeIndex=0, swipeTotal=0, hintShown=false;

function openDetail(id) {
  const p = products.find(x=>x.id===id);
  if(!p) return;
  currentDetailId = id;
  swipeIndex = 0;
  const bg = getBg(p.cat);
  swipeTotal = (p.images && p.images.length) || 1;
  const track = document.getElementById('swiperTrack');
  track.innerHTML = (p.images && p.images.length ? p.images : [null]).map((url) => {
    if(url) return `<div class="swiper-slide" style="background:${bg}"><img src="${url}" alt="" onerror="this.parentElement.innerHTML='<span class=\\"big-emoji\\">${p.emoji}</span>'"></div>`;
    return `<div class="swiper-slide" style="background:${bg}"><span class="big-emoji">${p.emoji}</span></div>`;
  }).join('');
  const dots = document.getElementById('swiperDots');
  dots.innerHTML = Array.from({length:swipeTotal},(_,i)=>`<div class="swiper-dot ${i===0?'active':''}" id="dot-${i}"></div>`).join('');
  dots.style.display = swipeTotal>1?'flex':'none';
  document.getElementById('swipeHint').classList.toggle('hidden', swipeTotal<=1||hintShown);
  document.getElementById('dCat').textContent = categories.find(c=>c.id===p.cat)?.label||p.cat;
  document.getElementById('dName').textContent = p.name;
  document.getElementById('dNameRu').textContent = p.nameRu||'';
  document.getElementById('ribbonPrice').innerHTML = `${p.price.toLocaleString('uz-UZ')} <small>so'm</small>`;
  updateDetailBtn();
  updateSwiper();
  const wrap = document.getElementById('swiperWrap');
  wrap.addEventListener('touchstart', onTouchStart, {passive:true});
  wrap.addEventListener('touchmove',  onTouchMove,  {passive:true});
  wrap.addEventListener('touchend',   onTouchEnd,   {passive:true});
  document.getElementById('detailOverlay').classList.add('visible');
  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('open');
  document.getElementById('detailOverlay').classList.remove('visible');
  const wrap = document.getElementById('swiperWrap');
  wrap.removeEventListener('touchstart', onTouchStart);
  wrap.removeEventListener('touchmove',  onTouchMove);
  wrap.removeEventListener('touchend',   onTouchEnd);
  currentDetailId = null;
}

function updateSwiper() {
  document.getElementById('swiperTrack').style.transform=`translateX(-${swipeIndex*100}%)`;
  for(let i=0;i<swipeTotal;i++){
    const d=document.getElementById('dot-'+i);
    if(d) d.className='swiper-dot'+(i===swipeIndex?' active':'');
  }
  for(let i=0;i<2;i++){
    const d=document.getElementById('langDot'+i);
    if(d) d.className='lang-dot'+(i===swipeIndex?' active':'');
  }
}
function onTouchStart(e){ swipeStartX=e.touches[0].clientX; swipeCurrentX=swipeStartX; swipeDragging=true; }
function onTouchMove(e){
  if(!swipeDragging) return;
  swipeCurrentX=e.touches[0].clientX;
  const diff=swipeStartX-swipeCurrentX;
  const base=swipeIndex*100;
  const pct=(diff/window.innerWidth)*100;
  document.getElementById('swiperTrack').style.transition='none';
  document.getElementById('swiperTrack').style.transform=`translateX(calc(-${base}% - ${pct}%))`;
}
function onTouchEnd(){
  if(!swipeDragging) return;
  swipeDragging=false;
  document.getElementById('swiperTrack').style.transition='';
  const diff=swipeStartX-swipeCurrentX;
  if(diff>50 && swipeIndex<swipeTotal-1){ swipeIndex++; hintShown=true; document.getElementById('swipeHint').classList.add('hidden'); }
  else if(diff<-50 && swipeIndex>0){ swipeIndex--; }
  updateSwiper();
}
function updateDetailBtn(){
  const inCart=currentDetailId&&cart[currentDetailId]>0;
  document.getElementById('detailAddBtn').className='detail-add-btn'+(inCart?' added':'');
  document.getElementById('detailAddLabel').textContent=inCart?`Savatchada (${cart[currentDetailId]} ta) ✓`:"Savatchaga qo'shish";
}
function detailAddToCart(){ if(!currentDetailId) return; addToCart(currentDetailId); updateDetailBtn(); }

/* ── CART ── */
function addToCart(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  cart[id]=(cart[id]||0)+1;
  updateCartUI(); renderProducts();
  showToast(`✓ ${p.name} qo'shildi`);
}
function changeQty(id,delta){
  cart[id]=(cart[id]||0)+delta;
  if(cart[id]<=0) delete cart[id];
  updateCartUI(); renderCartItems();
}
function updateCartUI(){
  const total=Object.values(cart).reduce((a,b)=>a+b,0);
  const badge=document.getElementById('cartBadge');
  const ibadge=document.getElementById('cartIconBadge');
  const count=document.getElementById('orderCount');
  badge.textContent=total; badge.style.display=total>0?'flex':'none';
  ibadge.textContent=total; ibadge.style.display=total>0?'flex':'none';
  count.textContent=total; count.style.display=total>0?'flex':'none';
  if(currentDetailId) updateDetailBtn();
}
function renderCartItems(){
  const el=document.getElementById('cartItems');
  const keys=Object.keys(cart).map(Number);
  if(!keys.length){
    el.innerHTML='<div class="empty-cart"><div>🛒</div><p>Savatcha bo\'sh</p></div>';
    document.getElementById('totalPrice').textContent="0 so'm"; return;
  }
  let totalSum=0;
  el.innerHTML=keys.map(id=>{
    const p=products.find(x=>x.id===id); const qty=cart[id]; const sub=p.price*qty; totalSum+=sub;
    const imgUrl=p.images&&p.images[0];
    return `<div class="cart-item">
      <div class="cart-item-img">${imgUrl?`<img src="${imgUrl}" alt="">`:`${p.emoji}`}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${p.name}</div>
        <div class="cart-item-price">${p.price.toLocaleString('uz-UZ')} × ${qty} = ${sub.toLocaleString('uz-UZ')} so'm</div>
      </div>
      <div class="cart-qty-ctrl">
        <button class="qty-btn qty-minus" onclick="changeQty(${id},-1)">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn qty-plus" onclick="changeQty(${id},+1)">+</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('totalPrice').textContent=totalSum.toLocaleString('uz-UZ')+' so\'m';
}
function openCart(){ renderCartItems(); document.getElementById('cartDrawer').classList.add('open'); document.getElementById('overlay').classList.add('visible'); }
function closeCart(){ document.getElementById('cartDrawer').classList.remove('open'); document.getElementById('overlay').classList.remove('visible'); }
function sendOrder(){
  const keys=Object.keys(cart).map(Number);
  if(!keys.length){ showToast("⚠️ Savatcha bo'sh!"); return; }
  const items=keys.map(id=>{ const p=products.find(x=>x.id===id); return {id:p.id,name:p.name,nameRu:p.nameRu,price:p.price,qty:cart[id]}; });
  if(tg) tg.sendData(JSON.stringify({items,note:document.getElementById('noteInput').value}));
}
function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2000); }

renderCategories();
renderProducts();
